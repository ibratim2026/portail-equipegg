<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Espace de validation · L'équipe Gabrielle Germain</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%23F5F1EA'/%3E%3Cpath d='M4.5 11.5 12 5l7.5 6.5M6.5 10v8.5h11V10' fill='none' stroke='%23DCA39A' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="haut">
  <div class="enveloppe haut-in">
    <a class="logo" href="#" aria-label="Accueil">
      <span class="logo-script">l'équipe</span>
      <span class="logo-nom">GABRIELLE</span>
      <span class="logo-sous">GERMAIN</span>
    </a>
    <div class="haut-droite" id="haut-droite" hidden>
      <span id="qui"></span>
      <button class="lien" id="deconnexion" type="button">Se déconnecter</button>
    </div>
  </div>
</header>

<main id="app" class="enveloppe">
  <div class="chargement" id="chargement">Chargement…</div>
</main>

<template id="tpl-connexion">
  <section class="connexion">
    <svg class="maison" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5M5.5 9.5V20h13V9.5"/></svg>
    <h1>Votre espace de <i>validation</i></h1>
    <p>Entrez votre courriel : vous recevrez un lien pour vous connecter, sans mot de passe.</p>
    <form id="form-connexion">
      <label for="courriel">Courriel</label>
      <input id="courriel" type="email" autocomplete="email" required placeholder="vous@exemple.com">
      <button class="bouton" type="submit">Recevoir mon lien</button>
    </form>
    <p class="message" id="message-connexion" role="status"></p>
  </section>
</template>

<script type="module" src="app.js"></script>
</body>
</html>
